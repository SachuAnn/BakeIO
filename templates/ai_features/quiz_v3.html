{% extends 'base.html' %}

{% block title %}Dessert DNA Quiz - BakeIO AI{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h1 style="font-size: 3.5rem;">🧬 Dessert <span style="color: var(--primary);">DNA</span></h1>
    <p style="color: #666; font-size: 1.1rem;">Help us unlock your flavor profile for perfect personalized matches.</p>
</div>

<div style="max-width: 600px; margin: 0 auto;">
    <div class="card" style="padding: 40px; border-radius: 25px;">
        <form method="post">
            {% csrf_token %}

            <!-- Flavor -->
            <div class="form-group mb-4">
                <label style="font-size: 1.1rem; font-weight: 700;">🍫 What's your top flavor profile?</label>
                <select name="flavor" required style="margin-top: 10px;">

                    <option value="chocolate"
                        {% if profile.favorite_flavor|default:'' == 'chocolate' %}selected{% endif %}>
                        🍫 I live for Chocolate
                    </option>

                    <option value="vanilla"
                        {% if profile.favorite_flavor|default:'' == 'vanilla' %}selected{% endif %}>
                        🍦 Creamy Vanilla / Custard
                    </option>

                    <option value="fruit"
                        {% if profile.favorite_flavor|default:'' == 'fruit' %}selected{% endif %}>
                        🍓 Fresh Fruit & Berries
                    </option>

                    <option value="nuts"
                        {% if profile.favorite_flavor|default:'' == 'nuts' %}selected{% endif %}>
                        🥜 Nutty & Earthy
                    </option>

                    <option value="spicy"
                        {% if profile.favorite_flavor|default:'' == 'spicy' %}selected{% endif %}>
                        🌶️ Spiced (Cinnamon/Ginger)
                    </option>

                </select>
            </div>

            <!-- Texture -->
            <div class="form-group mb-4">
                <label style="font-size: 1.1rem; font-weight: 700;">☁️ Preferred Texture?</label>
                <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr; gap: 10px;">

                    <label style="display: flex; gap: 10px; align-items: center;
                                  border: 1px solid #eee; padding: 15px; border-radius: 12px; cursor: pointer;">
                        <input type="radio" name="texture" value="soft" style="width: auto; margin: 0;"
                            {% if profile.texture_preference|default:'soft' == 'soft' %}checked{% endif %}>
                        <span>☁️ Soft, Light & Spongey</span>
                    </label>

                    <label style="display: flex; gap: 10px; align-items: center;
                                  border: 1px solid #eee; padding: 15px; border-radius: 12px; cursor: pointer;">
                        <input type="radio" name="texture" value="crunchy" style="width: auto; margin: 0;"
                            {% if profile.texture_preference|default:'' == 'crunchy' %}checked{% endif %}>
                        <span>🍪 Crunchy, Crispy & Nutty</span>
                    </label>

                    <label style="display: flex; gap: 10px; align-items: center;
                                  border: 1px solid #eee; padding: 15px; border-radius: 12px; cursor: pointer;">
                        <input type="radio" name="texture" value="creamy" style="width: auto; margin: 0;"
                            {% if profile.texture_preference|default:'' == 'creamy' %}checked{% endif %}>
                        <span>🥛 Creamy, Rich & Velvety</span>
                    </label>

                </div>
            </div>

            <!-- Sweetness -->
            <div class="form-group mb-4">
                <label style="font-size: 1.1rem; font-weight: 700;">
                    🍬 Sweet Tooth Intensity:
                    <span id="sval" style="color: var(--primary);">
                        {{ profile.sweet_tooth_level|default:5 }}
                    </span>
                </label>

                <input type="range"
                       name="sweetness"
                       min="1"
                       max="10"
                       value="{{ profile.sweet_tooth_level|default:5 }}"
                       oninput="document.getElementById('sval').innerText = this.value"
                       style="margin-top: 15px; accent-color: var(--primary);">

                <div style="display: flex; justify-content: space-between;
                            font-size: 12px; color: #999;">
                    <span>Mild</span>
                    <span>Sugar Rush</span>
                </div>
            </div>

            <button type="submit" class="btn"
                style="width: 100%; padding: 18px; font-size: 1.2rem; border-radius: 15px;">
                🔍 Unlock My Matches
            </button>
        </form>
    </div>
</div>
{% endblock %}
